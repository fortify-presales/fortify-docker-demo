# Port where the integration service will be listening for requests
# Mandatory: yes
# Default: N/A
# Example: 8182
server.port=8182

# Base URL where your Nexus IQ instance is running
# Mandatory: yes
# Default: N/A
# Example: http://iq-server:8070
iqserver.url=http://nexus-iq-server:8070

# Nexus IQ username
# Mandatory: yes
# Default: N/A
iqserver.username=admin

# Nexus IQ password
# Mandatory: yes
# Default: N/A
iqserver.password=admin

# Base URL where your Fortify SSC instance is running
# Mandatory: yes
# Default: N/A
# Example: http://ssc-server:8080/ssc
sscserver.url=http://ssc:8080

# CIToken generated by SSC.
# For more information, see https://www.microfocus.com/documentation/fortify-software-security-center/2010/SSC_Help_20.1.0/Content/SSC_UG/Gen_Auth_Tokens.htm
# Mandatory: yes
# Default: N/A
# Example: OTQwODFmZGMtMjNmZS00NGNjLWI2ZjEtOGU5MDdhMGNiMmI2
sscserver.token=YzRhODNiMDMtNTBmNi00NjRhLThhMzEtMjYzYzkyOGNmNzkw
#c4a83b03-50f6-464a-8a31-263c928cf790

# Work directory where JSON files are stored
# Mandatory: no
# Default: .work
# Example: /home/sonatype/work
loadfile.location=.

# Mapping file to be used as input for the batch process
# Mandatory: no
# Default: mapping.json
# Example: /home/sonatype/external_mapping.json
mapping.file=mapping.json

# Unsuppress issues in SSC that does not have a waiver associated
# Mandatory: no
# Default: false
# Examples: true, false
overwrite=false

# Define which report type to view
# Mandatory: no
# Default: policy
# Examples: raw, vulnerabilities, policy
iq.report.type=policy

# Minimum threat level for being considered critical
# Mandatory: no
# Default: 8
# Example: 8
priority.critical=8

# Minimum threat level for being considered high
# Mandatory: no
# Default: 4
# Example: 4
priority.high=4

# Minimum threat level for being considered medium
# Mandatory: no
# Default: 2
# Example: 2
priority.medium=2

# Time in seconds to run the issue suppression/unsuppresion job
# Mandatory: no
# Default: 30
# Example: 30
scheduling.waiver.suppression.delay=30

# Maximum retries before the job discard unprocessed artifacts
# Mandatory: no
# Default: 72
# Example: 72
scheduling.waiver.suppression.retries=72

# Location and name of the log file
# Mandatory: no
# Default: iq-ssc-integration.log
# Examples: /Users/sonatype/logs/iq-ssc-integration-custom.log
#           ../logs/custom-log-file.log
#           custom-log-file.log
logfile.location=iq-ssc-integration.log

# Logging level
# Mandatory: no
# Default: INFO
# Examples: ALL, TRACE, DEBUG, INFO, WARN, ERROR, FATAL, OFF
logLevel=INFO

# Exit after the first scheduled synchronization
# Mandatory: no
# Default: false
# Examples: true, false
killProcess=false

# Synchronize the mapping json file continuously
# Mandatory: no
# Default: true
# Examples: true, false
synchronize.projects.continuously=true

# Fixed rate to run continues synchronization in minutes
# Mandatory: no
# Default: 1
# Examples: 1, 5
scheduling.fixed.rate.minutes=5
