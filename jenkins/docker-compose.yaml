services:

  jenkins:
    image: jenkins/jenkins:${JENKINS_VERSION}
    container_name: "jenkins"
    ports:
      - "${JENKINS_WEB_PORT_EXTERNAL}:8080"
      - "${JENKINS_AGENT_PORT}:50000"
    restart: always
    volumes:
      - ftfydata_jenkins:/var/jenkins_home
    environment:
      - JAVA_OPTS="-Dhudson.footerURL=https://www.microfocus.com/en-us/cyberres/application-security"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${JENKINS_WEB_PORT_INTERNAL}"]
      interval: 120s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ftfydemo_net

networks:
  ftfydemo_net:
    external: true
volumes:
  ftfydata_jenkins:
