services:
  postgres:
    image: "postgres:${POSTGRES_VERSION:-17.5}"
    profiles:
      - scdast
    restart: unless-stopped
    shm_size: 256mb
    labels:
      - traefik.enable=false
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
    volumes:
      - ftfydata_postgres:/var/lib/postgresql/data
      - ./secrets/postgres-admin-password:/run/secrets/postgres-admin-password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ftfydemo_net

networks:
  ftfydemo_net:
    external: true

volumes:
  ftfydata_postgres:
