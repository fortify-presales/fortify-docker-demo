services:

  nexus-repo:
    image: sonatype/nexus3:${NEXUS_REPO_VERSION}
    container_name: "nexus-repo"
    restart: always
    ports: 
      - "${NEXUS_REPO_PORT}:8081"
    volumes:
      - ftfydata_nexus_repo:/nexus-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NEXUS_REPO_PORT}"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s      
    networks:
      - ftfydemo_net

  nexus-iq-server:
    image: sonatype/nexus-iq-server:${NEXUS_IQ_SERVER_VERSION}
    container_name: "nexus-iq-server"
    restart: always
    ports: 
      - "${NEXUS_IQ_SERVER_WEB_PORT}:8070"
      - "${NEXUS_IQ_SERVER_ADMIN_PORT}:8071"
    volumes:
      - ftfydata_sonatype-work:/sonatype-work
      - ftfydata_sonatype-logs:/var/log/nexus-iq-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NEXUS_IQ_SERVER_WEB_PORT}"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s      
    networks:
      - ftfydemo_net

  nexus-iq-integration-service:
    image: nexus-iq-integration-service:latest
    build: ./nexus-iq-integration-service
    container_name: "nexus-iq-integration-service"
    restart: always
    depends_on:
      nexus-iq-server:
        condition: service_healthy  
    ports: 
      - "${NEXUS_IQ_SERVER_INTEGRATION_PORT}:8182"
    volumes:
      - ftfydata_sonatype-integration:/var/nexus-iq-integration-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${NEXUS_IQ_SERVER_INTEGRATION_PORT}"]
      interval: 90s
      timeout: 10s
      retries: 3
      start_period: 40s      
    networks:
      - ftfydemo_net

networks:
  ftfydemo_net:
    external: true
volumes:
  ftfydata_nexus_repo:
  ftfydata_sonatype-work:
  ftfydata_sonatype-logs:
  ftfydata_sonatype-integration:
